[project]
name = "ds-portfolio-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedict Bohnen" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "kaggle>=2.2.5",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ds-portfolio-project = "ds_portfolio_project:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
